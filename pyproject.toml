[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PyTorchAberrations"
version = "0.3"
description = "Differentiable aberration layers for PyTorch using Zernike polynomials."
authors = [
    { name = "Sebastien M. Popoff", email = "sebastien.popoff@espci.psl.eu" },
    { name = "Maxime W. Matthes" },
    { name = "Rodrigo Gutierrez-Cuevas" },
]
license = { file = "LICENSE.md" }
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: CeCILL-B Free Software License Agreement (CECILL-B)",
]
dependencies = [
    "torch>=1.8",
    "numpy",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
test = ["pytest"]
notebooks = ["jupyter", "tqdm"]

[project.urls]
Homepage = "https://www.wavefrontshaping.net"
Repository = "https://github.com/wavefrontshaping/PyTorchAberrations"

[tool.setuptools.packages.find]
where = ["."]
include = ["PyTorchAberrations*"]
